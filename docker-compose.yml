services:
  gateway:
    image: traefik:v3.7.13
    container_name: facinect-gateway
    ports:
      - "8080:80"
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - facinect_internal
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: facinect-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_IDENTITY_DB}
      POSTGRES_USER: ${POSTGRES_IDENTITY_USER}
      POSTGRES_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_fac_identity.sql:/docker-entrypoint-initdb.d/01_fac_identity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_IDENTITY_USER} -d ${POSTGRES_IDENTITY_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - facinect_internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: facinect-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - facinect_internal
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: facinect-adminer
    profiles: ["dev"]
    ports:
      - "8089:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - facinect_internal
    restart: unless-stopped

  identity:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
    container_name: facinect-identity
    environment:
      APP_ENV: local
      HTTP_ADDR: ":8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_IDENTITY_DB}
      DB_USER: ${POSTGRES_IDENTITY_USER}
      DB_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_PRIVATE_KEY_PATH: /keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8080/v1/auth/google/callback}
      CORS_ORIGINS: "*"
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/auth/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=facinect_internal
      - traefik.http.routers.identity.rule=PathPrefix(`/v1/auth`)
      - traefik.http.routers.identity.entrypoints=web
      - traefik.http.routers.identity.priority=20
      - traefik.http.routers.identity.middlewares=rate-auth@file
      - traefik.http.services.identity.loadbalancer.server.port=8080
    networks:
      - facinect_internal
    restart: unless-stopped

  notifications:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: facinect-notifications
    environment:
      APP_ENV: local
      HTTP_ADDR: ":8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_IDENTITY_DB}
      DB_USER: ${POSTGRES_IDENTITY_USER}
      DB_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NOTIFICATIONS_SERVICE_KEY: ${NOTIFICATIONS_SERVICE_KEY:-}
      NOTIFICATIONS_DRY_RUN: ${NOTIFICATIONS_DRY_RUN:-true}
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_API_VERSION: ${META_API_VERSION:-v21.0}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      CORS_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/notifications/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=facinect_internal
      - traefik.http.routers.notifications.rule=PathPrefix(`/v1/notifications`)
      - traefik.http.routers.notifications.entrypoints=web
      - traefik.http.routers.notifications.priority=20
      - traefik.http.services.notifications.loadbalancer.server.port=8080
    networks:
      - facinect_internal
    restart: unless-stopped

  booking:
    build:
      context: ./services/booking
      dockerfile: Dockerfile
    container_name: facinect-booking
    environment:
      APP_ENV: local
      HTTP_ADDR: ":8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_IDENTITY_DB}
      DB_USER: ${POSTGRES_IDENTITY_USER}
      DB_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD}
      BOOKING_SERVICE_KEY: ${BOOKING_SERVICE_KEY:-}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ORIGINS: "*"
      BOOKING_OPEN_HOUR: ${BOOKING_OPEN_HOUR:-6}
      BOOKING_CLOSE_HOUR: ${BOOKING_CLOSE_HOUR:-22}
      BOOKING_SLOT_MINUTES: ${BOOKING_SLOT_MINUTES:-60}
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/booking/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=facinect_internal
      - traefik.http.routers.booking.rule=PathPrefix(`/v1/booking`)
      - traefik.http.routers.booking.entrypoints=web
      - traefik.http.routers.booking.priority=20
      - traefik.http.services.booking.loadbalancer.server.port=8080
    networks:
      - facinect_internal
    restart: unless-stopped

  students:
    build:
      context: ./services/students
      dockerfile: Dockerfile
    container_name: facinect-students
    environment:
      APP_ENV: local
      HTTP_ADDR: ":8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_IDENTITY_DB}
      DB_USER: ${POSTGRES_IDENTITY_USER}
      DB_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD}
      STUDENTS_SERVICE_KEY: ${STUDENTS_SERVICE_KEY:-}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ORIGINS: "*"
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/students/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=facinect_internal
      - traefik.http.routers.students.rule=PathPrefix(`/v1/students`)
      - traefik.http.routers.students.entrypoints=web
      - traefik.http.routers.students.priority=20
      - traefik.http.services.students.loadbalancer.server.port=8080
    networks:
      - facinect_internal
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: facinect-web
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=facinect_internal
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=10
      - traefik.http.services.web.loadbalancer.server.port=3000
    networks:
      - facinect_internal
    restart: unless-stopped

networks:
  facinect_internal:
    name: facinect_internal
    driver: bridge

volumes:
  postgres_data:
  redis_data:
